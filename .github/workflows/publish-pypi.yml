# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: Publish Python
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish pynect-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    if: github.repository == 'regbo/lfp-js'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: latest-known
      - name: Validate the release tag
        id: validate_the_release_tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |-
          project_tag="v$(uv version --project packages/pynect --short)"
          test "$project_tag" = "$RELEASE_TAG" || { echo "Expected $project_tag, received $RELEASE_TAG."; exit 1; }
      - name: Build the Python distribution
        id: build_the_python_distribution
        run: uv build --project packages/pynect --out-dir packages/pynect/dist/py --no-sources
      - name: Publish the Python distribution
        id: publish_the_python_distribution
        run: uv publish --trusted-publishing always packages/pynect/dist/py/*
    timeout-minutes: 10
permissions:
  contents: none
