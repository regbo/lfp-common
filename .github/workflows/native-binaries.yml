name: Native binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-binaries.yml
      - binding.gyp
      - scripts/build-native.js
      - scripts/docker-zero-python.sh
      - scripts/native-build-config.json
      - scripts/native-fingerprint.js
      - scripts/python.js
      - scripts/smoke-python-boundary.js
      - scripts/smoke-prebuild.js
      - scripts/stage-prebuild.js
      - bun.lock
      - src/native/**
  pull_request:
    paths:
      - .github/workflows/native-binaries.yml
      - binding.gyp
      - scripts/build-native.js
      - scripts/docker-zero-python.sh
      - scripts/native-build-config.json
      - scripts/native-fingerprint.js
      - scripts/python.js
      - scripts/smoke-python-boundary.js
      - scripts/smoke-prebuild.js
      - scripts/stage-prebuild.js
      - bun.lock
      - src/native/**

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: pynect-linux-x64-abi3
            compatibility_python: '3.10'
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: pynect-linux-arm64-abi3
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: pynect-darwin-x64-abi3
            compatibility_python: '3.10'
          - runner: macos-15
            platform: darwin
            arch: arm64
            artifact: pynect-darwin-arm64-abi3
          - runner: windows-2022
            platform: win32
            arch: x64
            artifact: pynect-win32-x64-abi3
            compatibility_python: '3.10'
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            artifact: pynect-win32-arm64-abi3

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      # npm is used only in this host-native matrix because it supports every
      # GitHub runner architecture, including Windows ARM64.
      - name: Install build dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      # The Windows ARM64 image uses Visual Studio 2026, which requires
      # node-gyp 12.1 or newer for toolchain discovery.
      - name: Enable Visual Studio 2026 builds
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund node-gyp@13.1.0

      - name: Build TypeScript
        # Invoke the portable build script directly because the host-native
        # matrix intentionally installs dependencies with npm on every runner.
        run: node scripts/build-typescript.js

      - name: Build native addon
        run: node scripts/build-native.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYFIG_INSTALL_PYTHON: '0'

      - name: Verify shared Python boundary
        run: node scripts/smoke-python-boundary.js

      - name: Install Linux binary metadata tool
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes patchelf

      - name: Stage prebuild
        run: node scripts/stage-prebuild.js

      - name: Verify staged prebuild
        run: node scripts/smoke-prebuild.js

      - name: Set up Python compatibility floor
        if: matrix.compatibility_python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.compatibility_python }}
          architecture: ${{ matrix.arch }}

      - name: Verify one prebuild across Python minors
        if: matrix.compatibility_python
        run: node scripts/smoke-prebuild.js
        env:
          PYNECT_PYTHON: python
          PYNECT_REQUIRES_PYTHON: "==${{ matrix.compatibility_python }}.*"
          PYNECT_MANAGED_PYTHON: ${{ matrix.compatibility_python }}
          PYFIG_INSTALL_PYTHON: '0'

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  zero-python:
    name: Bun-only zero-Python boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Pynect
        uses: actions/checkout@v6
        with:
          path: pynect

      - name: Verify bootstrap and native boundary without Node or Python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --env GITHUB_TOKEN \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/pynect,target=/source/pynect,readonly" \
            oven/bun:1-debian \
            sh /source/pynect/scripts/docker-zero-python.sh
