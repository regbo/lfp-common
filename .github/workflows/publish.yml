name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYNECT_SKIP_PREPACK: "1"

jobs:
  native-prebuilds:
    name: ${{ matrix.platform }}-${{ matrix.arch }} Python 3.12
    if: github.repository == 'regbo/pynect'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Enable Visual Studio 2026 builds
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund node-gyp@13.1.0
      - name: Build TypeScript
        run: node scripts/build-typescript.js
      - name: Build and verify native addon
        run: node scripts/build-native.js
        env:
          PYNECT_AUTO_INSTALL: '0'
      - name: Verify shared Python boundary
        run: node scripts/smoke-python-boundary.js
      - name: Stage prebuild
        run: node scripts/stage-prebuild.js
      - uses: actions/upload-artifact@v7
        with:
          name: pynect-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: native-prebuilds
    if: github.repository == 'regbo/pynect'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install a trusted-publishing npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download native prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: pynect-prebuild-*
          path: prebuilds
          merge-multiple: true
      - name: Verify tagged source
        run: bun run verify
      - name: Pack and audit the publication archive
        id: pack
        run: bun scripts/pack-for-publish.ts
      - name: Publish the audited archive
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest
