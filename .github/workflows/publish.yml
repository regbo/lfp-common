# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: Publish
on:
  push:
    tags:
      - v*.*.*
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm
    if: github.repository == 'regbo/lfp-js'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Setup bun
        id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: latest-known
      - name: Install a trusted-publishing npm version
        id: install_a_trusted-publishing_npm_version
        run: npm install --global npm@11.20.0
      - name: Validate the release tag
        id: validate_the_release_tag
        run: bun run release:check -- "${{ github.ref_name }}"
      - name: Build the tagged source
        id: build_the_tagged_source
        run: bun run build
      - name: Publish the generated archives
        id: publish_the_generated_archives
        run: bun run publish:release
      - name: Create GitHub release
        id: create_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/packages/*.tgz packages/pynect/dist/py/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
    timeout-minutes: 30
permissions:
  contents: none
