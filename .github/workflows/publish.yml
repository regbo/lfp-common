name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  LOQKIT_SKIP_PREPACK: "1"

jobs:
  publish:
    if: github.repository == 'regbo/loqkit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install a trusted-publishing npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tagged source
        run: bun run check
      - name: Pack and audit the publication archive
        id: pack
        run: bun scripts/pack-for-publish.ts
      - name: Publish the audited archive
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest
