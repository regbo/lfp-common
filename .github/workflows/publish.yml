# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: Publish
on:
  push:
    tags:
      - v*.*.*
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  LFP_JS_SKIP_PREPACK: "1"
jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    if: github.repository == 'regbo/lfp-js'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Setup bun
        id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile
      - name: Install a trusted-publishing npm version
        id: install_a_trusted-publishing_npm_version
        run: npm install --global npm@11.20.0
      - name: Validate the release tag
        id: validate_the_release_tag
        run: bun run release:check -- "${{ github.ref_name }}"
      - name: Build and audit the tagged source
        id: build_and_audit_the_tagged_source
        run: bun run build
      - name: Publish the audited archives
        id: publish_the_audited_archives
        run: bun run publish:release
    timeout-minutes: 30
permissions:
  contents: none
