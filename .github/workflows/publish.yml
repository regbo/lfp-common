name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYNECT_SKIP_PREPACK: "1"

jobs:
  native-plan:
    name: Plan native prebuilds
    if: github.repository == 'regbo/pynect'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      matrix: ${{ steps.plan.outputs.matrix }}
      node_major: ${{ steps.plan.outputs.node_major }}
      python_build_version: ${{ steps.plan.outputs.python_build_version }}
      python_minimum_version: ${{ steps.plan.outputs.python_minimum_version }}
      reuse: ${{ steps.plan.outputs.reuse }}
      source_version: ${{ steps.plan.outputs.source_version }}
      windows_arm_node_gyp: ${{ steps.plan.outputs.windows_arm_node_gyp }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Find compatible published prebuilds
        id: plan
        run: bun scripts/prepare-native-prebuilds.ts
      - name: Upload reused native prebuilds
        if: steps.plan.outputs.reuse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pynect-prebuild-reused
          path: prebuilds/
          if-no-files-found: error
          retention-days: 14

  native-prebuilds:
    name: ${{ matrix.platform }}-${{ matrix.arch }} Python >=${{ needs.native-plan.outputs.python_minimum_version }}
    needs: native-plan
    if: github.repository == 'regbo/pynect' && needs.native-plan.outputs.reuse != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.native-plan.outputs.node_major }}
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.native-plan.outputs.python_build_version }}
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Enable Visual Studio 2026 builds
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund node-gyp@${{ needs.native-plan.outputs.windows_arm_node_gyp }}
      - name: Build TypeScript
        run: node scripts/build-typescript.js
      - name: Build and verify native addon
        run: node scripts/build-native.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYFIG_INSTALL_PYTHON: '0'
      - name: Verify shared Python boundary
        run: node scripts/smoke-python-boundary.js
      - name: Install Linux binary metadata tool
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes patchelf
      - name: Stage prebuild
        run: node scripts/stage-prebuild.js
        env:
          PYNECT_EXPECTED_NATIVE_FINGERPRINT: ${{ needs.native-plan.outputs.fingerprint }}
      - name: Verify staged prebuild
        run: node scripts/smoke-prebuild.js
      - name: Set up Python compatibility floor
        if: matrix.compatibilityPython
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.compatibilityPython }}
          architecture: ${{ matrix.arch }}
      - name: Verify one prebuild across Python minors
        if: matrix.compatibilityPython
        run: node scripts/smoke-prebuild.js
        env:
          PYNECT_PYTHON: python
          PYNECT_REQUIRES_PYTHON: "==${{ matrix.compatibilityPython }}.*"
          PYNECT_MANAGED_PYTHON: ${{ matrix.compatibilityPython }}
          PYFIG_INSTALL_PYTHON: '0'
      - uses: actions/upload-artifact@v7
        with:
          name: pynect-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [native-plan, native-prebuilds]
    if: >-
      always() &&
      github.repository == 'regbo/pynect' &&
      needs.native-plan.result == 'success' &&
      (needs.native-plan.outputs.reuse == 'true' || needs.native-prebuilds.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install a trusted-publishing npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download native prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: pynect-prebuild-*
          path: prebuilds
          merge-multiple: true
      - name: Verify tagged source
        run: bun run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack and audit the publication archive
        id: pack
        run: bun scripts/pack-for-publish.ts
      - name: Publish the audited archive
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest
