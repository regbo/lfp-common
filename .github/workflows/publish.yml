name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYNECT_SKIP_PREPACK: "1"

jobs:
  publish:
    if: github.repository == 'regbo/pynect'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install a trusted-publishing npm version
        run: npm install --global npm@11.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify tagged source
        run: bun run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack and audit the publication archive
        id: pack
        run: bun scripts/pack-for-publish.ts
      - name: Create or update the GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: Publish the audited archive
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest
