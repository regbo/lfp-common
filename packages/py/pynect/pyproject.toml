# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

[project]
name = "pynect"
version = "0.8.15"
description = "Chanx schema export and owned stdio adapter for Pynect"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Development Status :: 4 - Beta",
  "Environment :: Console"
]
dependencies = [ "chanx[fast_channels]>=2.13.0,<3" ]

  [[project.authors]]
  name = "regbo"

  [project.urls]
  Homepage = "https://github.com/regbo/lfp-common/tree/main/packages/py/pynect#readme"
  Repository = "https://github.com/regbo/lfp-common.git"
  Issues = "https://github.com/regbo/lfp-common/issues"

  [project.scripts]
  pynect-schema = "pynect.schema:main"

[build-system]
requires = [ "uv_build>=0.10.7,<0.11" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pynect"
module-root = "src"

[tool.ruff]
line-length = 120
target-version = "py311"
src = [ "src", "tests" ]
exclude = [ "src/pynect/_generated" ]

  [tool.ruff.format]
  indent-style = "space"
  line-ending = "lf"
  quote-style = "double"

  [tool.ruff.lint]
  select = [ "E", "F", "I", "UP", "B", "SIM" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
