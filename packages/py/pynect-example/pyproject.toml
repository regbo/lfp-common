# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

[project]
name = "pynect-example"
version = "0.8.11"
description = "Python-owned Chanx model catalog consumed by the Pynect TypeScript example"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]
dependencies = [
  "chanx[fast_channels]>=2.13.0,<3",
  "pynect",
  "uvicorn[standard]>=0.40,<1"
]

  [[project.authors]]
  name = "regbo"

  [project.urls]
  Homepage = "https://github.com/regbo/lfp-common/tree/main/packages/py/pynect-example#readme"
  Repository = "https://github.com/regbo/lfp-common.git"
  Issues = "https://github.com/regbo/lfp-common/issues"

[build-system]
requires = [ "uv_build>=0.10.7,<0.11" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pynect_example"
module-root = "src"

[tool.uv.sources.pynect]
workspace = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = [ "src" ]

  [tool.ruff.format]
  indent-style = "space"
  line-ending = "lf"
  quote-style = "double"

  [tool.ruff.lint]
  select = [ "E", "F", "I", "UP", "B", "SIM" ]

    [tool.ruff.lint.per-file-ignores]
    "src/pynect_example/benchmark_native.py" = [ "E402" ]

[tool.pynect]
name = "model-catalog"
app = "pynect_example.server:app"
out = "_generated/model-catalog"
