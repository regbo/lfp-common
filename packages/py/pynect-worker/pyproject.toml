# ~~ Generated by projen. To modify, edit .projenrc.js and run "npx projen".

[project]
name = "pynect-worker"
version = "0.8.10"
description = "Chanx schema export and local IPC adapter for Pynect"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]
dependencies = [ "chanx[fast_channels]>=2.13.0,<3" ]

  [[project.authors]]
  name = "Reggie Bowser and NodePyX contributors"

  [project.urls]
  Homepage = "https://github.com/regbo/lfp-common/tree/main/packages/py/pynect-worker#readme"
  Repository = "https://github.com/regbo/lfp-common.git"
  Issues = "https://github.com/regbo/lfp-common/issues"

  [project.scripts]
  pynect-ipc = "pynect_worker.ipc:main"
  pynect-schema = "pynect_worker.schema:main"

[dependency-groups]
dev = [ "pytest>=9,<10", "ruff>=0.17,<1" ]

[build-system]
requires = [ "uv_build>=0.10.7,<0.11" ]
build-backend = "uv_build"

[tool.ruff]
exclude = [ "src/pynect_worker/_generated" ]
line-length = 120
target-version = "py311"
src = [ "src", "tests" ]

  [tool.ruff.format]
  indent-style = "space"
  line-ending = "lf"
  quote-style = "double"

  [tool.ruff.lint]
  select = [ "E", "F", "I", "UP", "B", "SIM" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.uv.build-backend]
module-name = "pynect_worker"
module-root = "src"
